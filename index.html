<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Bora · инструктор (тест)</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Всегда светлая тема: тёмная тема Telegram рябила и утомляла глаза (отзыв 13.10.2026) */
  color-scheme:light;
  --bg:#F7F9FB;
  --card:#FFFFFF;
  --text:#13212B;
  --hint:#5F6F7A;
  --line:#DFE5EA;
  --accent:#1B6491;
  --accentText:#FFFFFF;
  --link:#1B6491;
  --warn:#C9701E;--warnBg:rgba(217,130,43,.12);--warnText:#B5600F;
  --ok:#1F7A5C;--okBg:rgba(31,122,92,.10);--okText:#1F7A5C;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;font-size:15px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.app{min-height:100vh;display:flex;flex-direction:column}
.test{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;text-align:center;padding:5px;background:var(--warnBg);color:var(--warnText)}
.scroll{flex:1 1 auto;padding:14px 14px 96px;display:flex;flex-direction:column;gap:12px}
.sub{font-size:14px;color:var(--hint)}
h1{margin:0;font-size:23px;font-weight:700}
.card{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;padding:14px 15px;border-radius:14px;background:var(--card);border:1px solid var(--line);cursor:pointer}
.card.next{border:2px solid var(--accent);padding:13px 14px}
.card.need{border:2px solid var(--warn);padding:13px 14px;background:linear-gradient(var(--warnBg),var(--warnBg)),var(--card)}
.card.done{background:linear-gradient(var(--okBg),var(--okBg)),var(--card)}
.card.fresh{border:2px solid var(--ok);padding:13px 14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.time{font-size:24px;font-weight:700;letter-spacing:-0.01em}
.prod{font-size:17px;font-weight:600}
.fill{font-size:15px;font-weight:700;white-space:nowrap}
.unb{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;color:var(--hint);cursor:pointer}
.unb.on{background:#FBEBDD;border-color:#E3A47E;color:#8A3A12}
.unl{font-size:12.5px;color:#8A3A12;font-weight:600;padding:0 2px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--link)}
.mark{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600}
.mark.need{color:var(--warnText)}.mark.done,.mark.fresh{color:var(--okText)}.mark.next{color:var(--link)}
.note{font-size:13px;line-height:1.45;color:var(--hint)}
.back{align-self:flex-start;min-height:40px;padding:0;border:0;background:none;color:var(--link);font-weight:600;cursor:pointer}
.info{font-size:13px;line-height:1.4;background:color-mix(in srgb,var(--accent) 10%,var(--card));border-radius:12px;padding:10px 12px}
.sec{font-size:12.5px;font-weight:700;color:var(--hint);letter-spacing:.03em;text-transform:uppercase;padding-top:4px}
.prow{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.pname{font-size:15px;font-weight:600}.pinfo{font-size:12.5px;color:var(--hint)}
.att{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px 0 10px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:#33434E;font-weight:600;cursor:pointer;white-space:nowrap}
.att .box{width:22px;height:22px;border-radius:6px;border:2px solid #8FA1AD;display:inline-flex;align-items:center;justify-content:center;background:#fff}
.att.on{border-color:var(--ok);background:var(--okBg);color:var(--okText)}
.att.on .box{border-color:var(--ok);background:var(--ok);color:#fff}
.prow.ok{border-color:#9FCDBB}
.pst{font-size:12.5px;font-weight:600}.pst.ok{color:var(--okText)}.pst.need{color:var(--warnText)}
.absbox{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.absbox input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font:inherit;color:var(--text);background:#fff}
.abs{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#FBEBDD;border:1px solid #E3A47E;border-radius:10px;padding:8px 8px 8px 12px;font-size:14px;color:#8A3A12;font-weight:600}
.sm2{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;cursor:pointer}
.today{display:flex;flex-direction:column;gap:4px;background:var(--accent);color:#fff;border-radius:14px;padding:14px 16px}
.hw{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.hwh{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:12px 14px;border:0;background:none;text-align:left;cursor:pointer}
.hwi{display:flex;justify-content:space-between;gap:8px;padding:8px 14px;border-top:1px solid var(--line);font-size:13px}
.up{align-self:flex-start;min-height:36px;padding:0 12px;border-radius:999px;border:1px dashed var(--ok);background:transparent;color:var(--okText);font-size:13px;font-weight:600;cursor:pointer}
.up.on{border-style:solid;background:var(--okBg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;cursor:pointer}
.chip.sm{min-height:34px;padding:0 10px;font-size:13px}
.chip.on{background:color-mix(in srgb,var(--accent) 16%,var(--card));border-color:var(--accent);color:var(--link);font-weight:600}
textarea{width:100%;font:inherit;font-size:14px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;resize:none}
.dh{font-size:13px;font-weight:700;color:var(--hint);padding:4px 2px 0}.dh.today{color:var(--link)}
.wi{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.wi.closed{border-style:dashed;opacity:.8}.wi.closed .ws{color:var(--warnText);font-weight:600}
.ws{font-size:12.5px;color:var(--hint)}
.hrow{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.mono{font-weight:700}
.main{width:100%;min-height:50px;border:0;border-radius:12px;background:var(--accent);color:var(--accentText);font-size:16px;font-weight:600;cursor:pointer}
.ghost{min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;font-weight:600}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;min-height:54px;border:0;background:none;color:var(--hint);font-size:13.5px;cursor:pointer}
.tab.on{color:var(--link);font-weight:700}
.savebar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(14px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
.toast{position:fixed;left:12px;right:12px;top:12px;z-index:9;display:flex;gap:8px;align-items:flex-start;background:#13212B;color:#fff;border-radius:12px;padding:10px 6px 10px 14px;font-size:14px;line-height:1.35;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast span{flex:1;padding-top:3px}
.x{min-width:36px;min-height:32px;border:0;background:none;color:#fff;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
(function(){
var tg = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData !== undefined ? window.Telegram.WebApp : null;
var inTg = !!(tg && tg.platform && tg.platform !== 'unknown');
if (inTg) { try { tg.ready(); tg.expand(); } catch(e){} try { tg.setHeaderColor('#FFFFFF'); tg.setBackgroundColor('#F7F9FB'); if (tg.setBottomBarColor) tg.setBottomBarColor('#FFFFFF'); } catch(e){} }
var KEY = 'bora_instr_demo_v4';
function fresh0(){ return { unav:{}, tab:'today', open:null, att:{ b_0:true, b_1:true }, raise:{}, skills:{}, saved:{}, grades:{}, notes:{}, fresh:false, notice:'', abs:[], absFrom:'', absTo:'', hOpen:{ 0:true } }; }
var st = fresh0();
try { var raw = localStorage.getItem(KEY); if (raw) { var o = JSON.parse(raw); st = Object.assign(fresh0(), o, { open:null, notice:'' }); } } catch(e){}
function persist(){ try { var c = Object.assign({}, st); delete c.notice; localStorage.setItem(KEY, JSON.stringify(c)); } catch(e){} }
function set(p){ Object.assign(st, p); persist(); render(); }
function haptic(t){ try { if (inTg) tg.HapticFeedback.impactOccurred(t||'light'); } catch(e){} }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
var userName = 'Вит';
try { if (inTg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) userName = tg.initDataUnsafe.user.first_name; } catch(e){}
var NOW = '15:10', RATE_RSD = 1850;
var SKILLS = ['Оверштаг','Фордевинд','Рулевой','Работа с гротом','Спинакер','Старт','Швартовка'];
function data(){
  return [
    { id:'e', time:'08:00', end:'10:00', boat:'Лодка 2', product:'Training Melges 20', people:[
      { name:'Илья К.', g:2, info:'9-я тренировка · абонемент, осталось 5' },
      { name:'Ольга В.', g:3, info:'14-я тренировка' },
      { name:'Сергей Т.', g:2, info:'4-я тренировка · разовая оплата' } ] },
    { id:'a', time:'10:00', end:'12:00', boat:'Лодка 1', product:'Training + breakfast', people:[] },
    { id:'b', time:'13:00', end:'15:00', boat:'Лодка 2', product:'Training for beginners', adminAtt:'админ', people:[
      { name:'Анна П.', g:1, info:'6-я тренировка · абонемент, осталось 3' },
      { name:'Гость Анны П.', g:0, info:'Первый раз · без профиля' } ] },
    { id:'c', time:'15:30', end:'17:30', boat:'Лодка 1', product:'Training Melges 20', people:[
      { name:'Дамир Г.', g:3, info:'17-я тренировка · прошлый раз: старт' },
      { name:'Павел Л.', g:2, info:'3-я тренировка' },
      { name:'Михаил Н.', g:4, info:'абонемент, осталось 1 — напомни про продление' },
      { name:'Ксения С.', g:3, info:'22-я тренировка' } ] },
    { id:'d', time:'17:30', end:'19:30', boat:'Лодка 3', product:'Training Melges 20', people: st.fresh ? [ { name:'Ксения С.', g:3, info:'записалась только что' } ] : [] }
  ];
}
function grade(p){ return st.grades[p.name] || p.g; }
function fmt(n){ return Math.round(n).toLocaleString('ru-RU'); }
var H = {}; var hid = 0;
function on(fn){ var k = 'h' + (hid++); H[k] = fn; return k; }
var CHECK = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M3 8.5l3 3 7-7"/></svg>';

function listView(){
  var list = data(), vis = list.filter(function(x){ return x.people.length; });
  var nextId = (vis.find(function(x){ return x.time > NOW; }) || {}).id;
  var n = vis.length;
  var h = '<div class="sub">Демо-день: суббота, 5 сентября · сейчас 15:10</div><h1>' + esc(userName) + ', у тебя ' + n + (n===1?' выход':(n<5?' выхода':' выходов')) + '</h1>';
  vis.forEach(function(x){
    var past = x.end <= NOW, sv = st.saved[x.id], isFresh = x.id==='d' && st.fresh && !sv;
    var cls='card', mark='', mc='mark', done=false;
    if (sv==='full'){ cls+=' done'; mark='Готово: явка и что отработали'; mc+=' done'; done=true; }
    else if (past && sv==='att'){ cls+=' need'; mark='Явка есть — отметь, что отработали (до конца дня)'; mc+=' need'; }
    else if (past && x.adminAtt){ cls+=' need'; mark='Явку отметил админ — отметь, что отработали'; mc+=' need'; }
    else if (past){ cls+=' need'; mark='Прошла — отметь явку и что отработали'; mc+=' need'; }
    else if (isFresh){ cls+=' fresh'; mark='Новая запись'; mc+=' fresh'; }
    else if (x.id===nextId){ cls+=' next'; mark='Следующий'; mc+=' next'; }
    h += '<button class="'+cls+'" data-h="'+on(function(){ haptic(); set({ open:x.id }); window.scrollTo(0,0); })+'">'
      + '<span class="row"><span class="time">'+x.time+'</span><span class="sub" style="font-size:13px">'+x.boat+'</span></span>'
      + '<span class="row" style="align-items:baseline"><span class="prod">'+esc(x.product)+'</span><span class="fill">'+x.people.length+' из 4</span></span>'
      + (mark ? '<span class="'+mc+'">'+(done?CHECK:'')+mark+'</span>' : '')
      + '</button>';
  });
  h += '<div class="note">Явку и «что отработали» отмечай до конца дня. Явку может отметить и админ, «что отработали» — только ты.<br>Выходы без записей здесь не показываются. Новые записи появляются в списке сами.</div>';
  return h;
}
function curSlot(){ var l = data(); return l.find(function(x){ return x.id===st.open; }); }
function detailView(){
  var c = curSlot(); if (!c) return listView();
  var started = c.time <= NOW, sk = st.skills[c.id] || {};
  var h = inTg ? '' : '<button class="back" data-h="'+on(goBack)+'">‹ Мои выходы</button>';
  h += '<div class="sub">'+c.time+'–'+c.end+' · '+c.boat+'</div><h1 style="font-size:21px">'+esc(c.product)+'</h1>';
  if (c.adminAtt && st.saved[c.id]!=='full') h += '<div class="info">Явку отметил админ (15:05). Проверь и отметь, что отработали — это можешь сделать только ты.</div>';
  h += '<div class="sec">Явка</div>';
  c.people.forEach(function(p,i){
    var key=c.id+'_'+i, isOn=!!st.att[key], g=grade(p), up=!!st.raise[key];
    var psk0 = st.skills[key] || {}, nSk = Object.keys(psk0).filter(function(k){ return psk0[k]; }).length;
    h += '<div class="prow'+(isOn&&nSk?' ok':'')+'"><div class="row"><div style="min-width:0;display:flex;flex-direction:column;gap:2px"><span class="pname">'+esc(p.name)+'</span><span class="pinfo">'+(g?'G'+g+' · ':'')+esc(p.info)+'</span></div>'
      + '<button class="att'+(isOn?' on':'')+'" role="checkbox" aria-checked="'+isOn+'" data-h="'+on(function(){ haptic(); var a=Object.assign({},st.att); a[key]=!isOn; var r=Object.assign({},st.raise); if(isOn) delete r[key]; set({att:a,raise:r}); })+'"><span class="box" aria-hidden="true">'+(isOn?CHECK:'')+'</span>Пришёл</button></div>';
    if (started) h += '<span class="pst '+(isOn&&nSk?'ok':'need')+'">'+(isOn ? (nSk ? '✓ Явка и навыки отмечены' : 'Пришёл — отметь, что отработали') : (nSk ? 'Навыки есть — поставь «Пришёл»' : 'Не отмечен'))+'</span>';
    if (started) {
      var psk = st.skills[key] || {};
      h += '<div style="border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px"><span class="sec" style="padding-top:0;font-size:11.5px">Что отработано</span><div class="chips">';
      SKILLS.forEach(function(l){ h += '<button class="chip sm'+(psk[l]?' on':'')+'" aria-pressed="'+!!psk[l]+'" data-h="'+on(function(){ haptic(); var all=Object.assign({},st.skills), m=Object.assign({},psk); m[l]=!psk[l]; all[key]=m; var a=Object.assign({},st.att); if (m[l]) a[key]=true; set({skills:all, att:a}); })+'">'+l+'</button>'; });
      h += '</div></div>';
    }
    if (isOn && started && g>0 && g<6 && !st.grades[p.name])
      h += '<button class="up'+(up?' on':'')+'" aria-pressed="'+up+'" data-h="'+on(function(){ haptic(); var r=Object.assign({},st.raise); r[key]=!up; set({raise:r}); })+'">'+(up?'Будет G'+(g+1)+' после сохранения · отменить':'↑ Повысить до G'+(g+1))+'</button>';
    h += '</div>';
  });
  var presentIdx = c.people.map(function(p,i){ return i; }).filter(function(i){ return st.att[c.id+'_'+i]; });
  if (started && presentIdx.length > 1) {
    h += '<div class="note" style="font-size:12.5px">Быстро отметить всем, кто пришёл:</div><div class="chips">';
    SKILLS.forEach(function(l){ h += '<button class="chip sm" data-h="'+on(function(){ haptic(); var all=Object.assign({},st.skills); presentIdx.forEach(function(i){ var k2=c.id+'_'+i; var o=Object.assign({},all[k2]||{}); o[l]=true; all[k2]=o; }); set({skills:all}); })+'">+ '+l+'</button>'; });
    h += '</div>';
  }
  h += '<div class="note" style="font-size:12.5px">Навыки отмечаешь только ты и по каждому отдельно — они попадают в карточку клиента («Прогресс»).</div><label class="sec" for="nt">Заметка для следующего инструктора</label><textarea id="nt" rows="3" placeholder="Например: Илья уверенно рулит, дальше — работа со спинакером">'+esc((st.notes||{})[c.id]||'')+'</textarea>';
  h += '<div class="note" style="text-align:center">'+(started?'Явка и «что отработали» — до конца дня':'Тренировка ещё не началась')+'</div>';
  if (!inTg) h += '<div class="savebar"><button class="main" data-h="'+on(save)+'">Сохранить</button></div>';
  return h;
}
function save(){
  var c = curSlot(); if (!c) return;
  var present = c.people.filter(function(p,i){ return st.att[c.id+'_'+i]; });
  if (!present.length){ try{ if(inTg) tg.HapticFeedback.notificationOccurred('error'); }catch(e){} set({ notice:'Отметь, кто пришёл. Если не пришёл никто — напиши админу.' }); return; }
  function skOf(i){ var o = st.skills[c.id+'_'+i] || {}; return Object.keys(o).filter(function(k){ return o[k]; }); }
  var presentI = c.people.map(function(p,i){ return i; }).filter(function(i){ return st.att[c.id+'_'+i]; });
  var missing = presentI.filter(function(i){ return !skOf(i).length; }).map(function(i){ return c.people[i].name; });
  var hasSk = presentI.length > 0 && missing.length === 0;
  var skLine = presentI.filter(function(i){ return skOf(i).length; }).map(function(i){ return c.people[i].name+': '+skOf(i).join(', ').toLowerCase(); }).join('; ');
  var grades=Object.assign({},st.grades), r=Object.assign({},st.raise), raised=[];
  c.people.forEach(function(p,i){ var key=c.id+'_'+i; if (r[key] && st.att[key]) { var g=grade(p)+1; grades[p.name]=g; raised.push(p.name+' → G'+g); } delete r[key]; });
  var saved=Object.assign({},st.saved); saved[c.id]=hasSk?'full':'att';
  var msg = hasSk ? 'Сохранено. Навыки ушли в карточки клиентов — '+skLine+'.' : 'Явка сохранена. Не отмечено, что отработали: '+missing.join(', ')+' — напомню в вечернем плане.';
  if (raised.length) msg += ' Грейд повышен: '+raised.join(', ')+' — клиенту ушло поздравление.';
  try{ if(inTg) tg.HapticFeedback.notificationOccurred('success'); }catch(e){}
  set({ saved:saved, grades:grades, raise:r, open:null, notice:msg }); window.scrollTo(0,0);
}
function goBack(){ set({ open:null }); window.scrollTo(0,0); }
function weekView(){
  var vis = data().filter(function(x){ return x.people.length; });
  function I(t,p,b,f){ return { time:t, product:p, sub:b+' · '+f, closed:false }; }
  var days = [
    { label:'Пн, 31 августа', items:[I('18:00','Training Melges 20','Лодка 1','3 из 4')] },
    { label:'Вт, 1 сентября', items:[] },
    { label:'Ср, 2 сентября', items:[I('18:00','Training Melges 20','Лодка 2','2 из 4')] },
    { label:'Чт, 3 сентября', items:[I('18:00','Training for beginners','Лодка 1','3 из 4')] },
    { label:'Пт, 4 сентября', items:[I('18:00','Training Melges 20','Лодка 3','4 из 4')] },
    { label:'Сб, 5 сентября · сегодня', today:true, items: vis.map(function(x){ return I(x.time,x.product,x.boat,x.people.length+' из 4'); }) },
    { label:'Вс, 6 сентября', items:[{ time:'13:00', product:'Training Melges 20', sub:'Закрыт админом · погода', closed:true }] }
  ];
  var outs = days.reduce(function(a,d){ return a + d.items.filter(function(i){ return !i.closed; }).length; }, 0);
  var h = '<div class="sub">31 августа — 6 сентября</div><h1>Неделя: '+outs+' выходов · '+(outs*2)+' ч</h1>'

    + '<button class="main" style="min-height:44px;font-size:15px" data-h="'+on(function(){ haptic();
        var f = st.absFrom, t = st.absTo || st.absFrom;

        if (f < '2026-09-05') return set({ notice:'Прошедшие дни отмечать не нужно — выбери даты с сегодняшнего.' });
        var hit = KEYS.filter(function(k, i){ return k >= f && k <= t && days[i].items.some(function(x){ return !x.closed; }); });

    if (un) h += '<div class="unl">Отмечено: не можешь. Админ не поставит тебя на выход в этот день.</div>';

    d.items.forEach(function(x){ h += '<div class="wi'+(x.closed?' closed':'')+'"><span style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-weight:600">'+esc(x.product)+'</span><span class="ws">'+esc(x.sub)+'</span></span><span class="mono">'+x.time+'</span></div>'; });
  });
  return h;
}

  var weeks = [

    { label:'10–16 августа', items:[W('Пн 10.08','18:00–20:00','Training Melges 20',3,2),W('Ср 12.08','18:00–20:00','Training Melges 20',2,2),W('Чт 13.08','18:00–20:00','Training for beginners',4,2),W('Сб 15.08','10:00–12:00','Training + breakfast',3,2),W('Сб 15.08','15:30–17:30','Training Melges 20',4,2),W('Вс 16.08','13:00–15:00','Training Melges 20',2,2)] }
  ];
  weeks[0].items = weeks[0].items.filter(function(x){ return x.ppl > 0; });

    var hh = done.reduce(function(a,x){ return a+x.h; }, 0); total += hh; var op = !!(st.hOpen||{})[j];
    body += '<div class="hw"><button class="hwh" aria-expanded="'+op+'" data-h="'+on(function(){ haptic(); var o=Object.assign({},st.hOpen||{}); o[j]=!op; set({hOpen:o}); })+'"><span style="display:flex;flex-direction:column;gap:2px"><span style="font-weight:600">'+(op?'▾':'▸')+' '+w.label+'</span><span class="ws">'+done.length+' '+(done.length===1?'выход':(done.length<5?'выхода':'выходов'))+(plan.length?' · ещё '+plan.length+' впереди':'')+'</span></span><span class="mono" style="white-space:nowrap">'+hh+' ч · '+fmt(hh*RATE_RSD)+' RSD</span></button>';
    if (op) w.items.forEach(function(x){ body += '<div class="hwi"><span style="display:flex;flex-direction:column;gap:1px;min-width:0"><span style="font-weight:600">'+x.day+' · '+x.time+'</span><span class="ws">'+esc(x.product)+' · '+x.ppl+' чел.</span></span><span style="white-space:nowrap;font-weight:600;color:'+(x.st==='done'?'var(--text)':'var(--hint)')+'">'+(x.st==='done'?x.h+' ч · '+fmt(x.h*RATE_RSD):(x.st==='closed'?'закрыт':'впереди'))+'</span></div>'; });
    body += '</div>';
  });
  var td = weeks[0].items.filter(function(x){ return x.day==='Сб 05.09' && x.st==='done'; }), tp = weeks[0].items.filter(function(x){ return x.day==='Сб 05.09' && x.st==='plan'; });
  var tH = td.reduce(function(a,x){ return a+x.h; },0), pH = tp.reduce(function(a,x){ return a+x.h; },0);
  return '<div class="sub">Ставка '+fmt(RATE_RSD)+' RSD в час · грейд G5</div><h1>'+total+' ч · '+fmt(total*RATE_RSD)+' RSD</h1><div class="sub" style="font-size:13px">за 4 недели, по выходам, которые уже прошли</div>'
    + '<div class="today"><span style="font-size:13px;opacity:.85">Сегодня, 5 сентября</span><span style="font-size:22px;font-weight:700">'+tH+' ч · '+fmt(tH*RATE_RSD)+' RSD</span><span style="font-size:13px;opacity:.9">'+td.length+' выхода прошли'+(tp.length?' · впереди ещё '+tp.length+' ('+pH+' ч · '+fmt(pH*RATE_RSD)+' RSD), если всё состоится':'')+'</span></div>'

    + '<button class="ghost" data-h="'+on(function(){ try{ localStorage.removeItem(KEY); }catch(e){} st=fresh0(); st.notice='Демо сброшено к началу дня.'; render(); })+'">Сбросить демо</button>';

document.addEventListener('input', function(e){ if (e.target.id==='nt' && st.open) { st.notes = Object.assign({}, st.notes); st.notes[st.open] = e.target.value; persist(); } });

document.addEventListener('click', function(e){ var b = e.target.closest('[data-h]'); if (b && H[b.getAttribute('data-h')]) H[b.getAttribute('data-h')](); });
if (inTg) { try { tg.BackButton.onClick(goBack); tg.MainButton.onClick(save); } catch(e){} }
render();
if (!st.fresh) setTimeout(function(){ set({ fresh:true }); }, 4000);
})();
